<script type="text/babel">

// Atrapa cualquier error (aunque sea de Firebase) y lo muestra como alert.
// Así en el celular, sin consola, podés ver qué está fallando.
window.addEventListener("error", (e) => alert("Error: " + e.message));
window.addEventListener("unhandledrejection", (e) => alert("Error: " + (e.reason && e.reason.message ? e.reason.message : e.reason)));

// Usuario y contraseña de admin (cambialos si querés)
const ADMIN_USER = "admin";
const ADMIN_PASS = "1234";

// Convierte un link de Google Drive (de "compartir") a un link de imagen directa.
// Los links de Drive normales devuelven una página HTML, no la imagen en sí,
// por eso no cargan en un <img>. Si detecta un link de Drive, lo convierte;
// si no, devuelve la URL tal cual (para links de Imgur, etc. que ya son directos).
function convertirLinkFoto(url) {
  if (!url) return url;
  const m = url.match(/drive\.google\.com\/file\/d\/([^/]+)/) || url.match(/[?&]id=([^&]+)/);
  if (m && m[1]) return `https://lh3.googleusercontent.com/d/${m[1]}`;
  return url;
}

// ============ HELPERS ============
function calcularEstadisticas(j) {
  const pj = j.pj || 0;
  const puntos = j.puntos || 0;
  const promedio = pj > 0 ? (puntos / pj) : 0;
  return { ...j, pj, promedio };
}

function ordenarTabla(jugadores) {
  return [...jugadores]
    .map(calcularEstadisticas)
    .sort((a, b) => {
      if (b.promedio !== a.promedio) return b.promedio - a.promedio;
      if ((b.puntos||0) !== (a.puntos||0)) return (b.puntos||0) - (a.puntos||0);
      return (b.pj||0) - (a.pj||0);
    });
}

// Sortea dos equipos balanceados según calidad. Si hay 2+ arqueros, reparte
// uno de cada lado. Si hay 0 o 1 arquero, ese arquero cuenta como 4 estrellas
// para el sorteo (su calidad real no se usa para balancear).
function armarEquipos(disponibles) {
  const arqueros = disponibles.filter(j => j.arquero);
  const campo = disponibles.filter(j => !j.arquero);
  let equipoA = [], equipoB = [], sumaA = 0, sumaB = 0;

  if (arqueros.length >= 2) {
    const arqOrdenados = [...arqueros].sort((a, b) => b.calidad - a.calidad);
    arqOrdenados.forEach((j, i) => {
      if (i % 2 === 0) { equipoA.push(j); sumaA += j.calidad; }
      else { equipoB.push(j); sumaB += j.calidad; }
    });
    const resto = [...campo].sort((a, b) => b.calidad - a.calidad);
    resto.forEach(j => {
      if (sumaA <= sumaB) { equipoA.push(j); sumaA += j.calidad; }
      else { equipoB.push(j); sumaB += j.calidad; }
    });
  } else {
    const todos = disponibles
      .map(j => ({ ...j, valorDraft: j.arquero ? 4 : j.calidad }))
      .sort((a, b) => b.valorDraft - a.valorDraft);
    todos.forEach(j => {
      if (sumaA <= sumaB) { equipoA.push(j); sumaA += j.valorDraft; }
      else { equipoB.push(j); sumaB += j.valorDraft; }
    });
  }
  return { equipoA, equipoB };
}

function Estrellas({ n, onClick }) {
  return (
    <span className="text-yellow-500 text-xl select-none">
      {Array.from({ length: 5 }).map((_, i) => (
        <span
          key={i}
          onClick={() => onClick && onClick(i + 1)}
          style={{ cursor: onClick ? "pointer" : "default" }}
        >
          {i < n ? "★" : "☆"}
        </span>
      ))}
    </span>
  );
}

function Cuadritos({ ultimos = [] }) {
  const colores = { V: "#22c55e", E: "#eab308", D: "#ef4444" };
  const slots = [...ultimos].slice(0, 5);
  while (slots.length < 5) slots.push(null);
  return (
    <div className="flex">
      {slots.map((r, i) => (
        <span
          key={i}
          className="cuadrito"
          style={{ background: r ? colores[r] : "#d1d5db" }}
          title={r === "V" ? "Ganado" : r === "E" ? "Empatado" : r === "D" ? "Perdido" : "—"}
        ></span>
      ))}
    </div>
  );
}

// ============ PODIO (estilo tarjetas FIFA) ============
function TarjetaPodio({ j, puesto }) {
  const meta = {
    1: { medalla: "🥇", frame: "frame-oro", card: "card-oro pulse-glow", label: "1°", color: "text-[#FFD700]" },
    2: { medalla: "🥈", frame: "frame-plata", card: "card-plata", label: "2°", color: "text-[#E8E8E8]" },
    3: { medalla: "🥉", frame: "frame-bronce", card: "card-bronce", label: "3°", color: "text-[#CD7F32]" }
  }[puesto];

  return (
    <div className={`glass glass-hover rounded-2xl p-4 flex flex-col items-center w-40 sm:w-48 ${meta.card}`}>
      <div className={`text-2xl mb-1 ${meta.color} badge-neon`}>{meta.medalla} {meta.label}</div>
      <div className={`foto-podio-frame ${meta.frame} mb-2`}>
        <img src={j.foto || "https://via.placeholder.com/80?text=%20"} className="foto-podio" alt={j.nombre} />
      </div>
      <p className="font-bold text-center leading-tight">{j.nombre} {j.arquero && "🧤"}</p>
      <p className={`text-2xl font-extrabold ${meta.color}`}>{j.promedio.toFixed(2)}</p>
      <p className="text-[10px] uppercase tracking-wide text-slate-400 mb-2">pts / partido</p>
      <div className="grid grid-cols-3 gap-2 w-full text-center text-xs text-slate-300 border-t border-white/10 pt-2">
        <div><p className="font-bold text-white">{j.pj || 0}</p><p>PJ</p></div>
        <div><p className="font-bold text-white">{j.pg || 0}</p><p>PG</p></div>
        <div><p className="font-bold text-white">{j.goles || 0}</p><p>Goles</p></div>
      </div>
    </div>
  );
}

function Podio({ tabla }) {
  const top3 = tabla.slice(0, 3);
  if (top3.length === 0) return null;
  const orden = [1, 0, 2]; // 2do - 1ro - 3ro
  return (
    <div className="mb-8 fade-in-up">
      <h2 className="text-center text-lg font-bold tracking-wide text-slate-300 mb-4">🏆 PODIO DEL TORNEO 🏆</h2>
      <div className="flex justify-center items-end gap-3 sm:gap-5 flex-wrap">
        {orden.map((idx, i) => {
          const j = top3[idx];
          if (!j) return null;
          return (
            <div key={j.id} className="fade-in-up" style={{ animationDelay: `${i * 0.12}s` }}>
              <TarjetaPodio j={j} puesto={idx + 1} />
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ============ TABLA DE POSICIONES ============
function HistorialJugador({ j }) {
  const historial = [...(j.historial || [])].reverse();
  if (historial.length === 0) {
    return <p className="text-xs text-slate-400 p-3">Sin partidos individuales cargados todavía (solo estadísticas globales).</p>;
  }
  return (
    <div className="p-3 expand-down">
      <table className="w-full text-xs">
        <thead>
          <tr className="text-slate-400">
            <th className="text-left p-1">Fecha</th>
            <th className="p-1">Resultado</th>
            <th className="p-1">Goles</th>
          </tr>
        </thead>
        <tbody>
          {historial.map((h, i) => (
            <tr key={i} className="border-t border-white/10">
              <td className="p-1">{h.fecha}</td>
              <td className="p-1 text-center">
                {h.resultado === "V" ? "✅ Ganó" : h.resultado === "E" ? "🟨 Empató" : "🟥 Perdió"}
              </td>
              <td className="p-1 text-center">{h.goles || 0}</td>
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );
}

function TablaPosiciones({ tabla }) {
  const [expandido, setExpandido] = useState(null);
  return (
    <div className="glass rounded-2xl overflow-hidden fade-in-up">
      <div className="overflow-x-auto">
        <table className="w-full text-sm">
          <thead>
            <tr className="bg-white/5 text-slate-300 text-xs uppercase tracking-wide">
              <th className="p-3 text-left">#</th>
              <th className="p-3 text-left">Jugador</th>
              <th className="p-3">PJ</th>
              <th className="p-3">PG</th>
              <th className="p-3">PE</th>
              <th className="p-3">PP</th>
              <th className="p-3">Prom.</th>
              <th className="p-3">Goles</th>
              <th className="p-3 text-left">Últimos 5</th>
            </tr>
          </thead>
          <tbody>
            {tabla.map((j, i) => (
              <React.Fragment key={j.id}>
                <tr
                  className="fila-jugador cursor-pointer border-t border-white/5 fade-in-up"
                  style={{ animationDelay: `${Math.min(i, 12) * 0.04}s` }}
                  onClick={() => setExpandido(expandido === j.id ? null : j.id)}
                >
                  <td className="p-3 font-bold text-slate-400">{i + 1}</td>
                  <td className="p-3 flex items-center gap-2">
                    <img src={j.foto || "https://via.placeholder.com/56?text=%20"} className="foto-jugador" alt={j.nombre} />
                    <span className="font-medium">{j.nombre} {j.arquero && <span title="Arquero">🧤</span>}</span>
                  </td>
                  <td className="p-3 text-center">{j.pj || 0}</td>
                  <td className="p-3 text-center">{j.pg || 0}</td>
                  <td className="p-3 text-center">{j.pe || 0}</td>
                  <td className="p-3 text-center">{j.pp || 0}</td>
                  <td className="p-3 text-center font-bold text-[#FFD700]">{j.promedio.toFixed(2)}</td>
                  <td className="p-3 text-center">{j.goles || 0}</td>
                  <td className="p-3"><Cuadritos ultimos={j.ultimos} /></td>
                </tr>
                {expandido === j.id && (
                  <tr>
                    <td colSpan="9" className="bg-black/20">
                      <HistorialJugador j={j} />
                    </td>
                  </tr>
                )}
              </React.Fragment>
            ))}
            {tabla.length === 0 && (
              <tr><td colSpan="9" className="p-4 text-center text-slate-400">Todavía no hay jugadores cargados</td></tr>
            )}
          </tbody>
        </table>
      </div>
      <p className="text-xs text-slate-500 p-3">Tocá un jugador para ver su historial de partidos.</p>
    </div>
  );
}

// ============ ESTADÍSTICAS DESTACADAS (tabs) ============
function rachaActual(j) {
  const u = j.ultimos || [];
  let r = 0;
  for (let i = 0; i < u.length; i++) {
    if (u[i] === "V") r++; else break;
  }
  return r;
}

function BarraEfectividad({ pct }) {
  return (
    <div className="barra-fondo h-2 w-full">
      <div className="barra-fill" style={{ width: `${pct}%` }}></div>
    </div>
  );
}

function StatsTabs({ tabla }) {
  const [tab, setTab] = useState("goleadores");

  const goleadores = [...tabla].filter(j => (j.goles || 0) > 0).sort((a, b) => (b.goles || 0) - (a.goles || 0)).slice(0, 10);
  const arqueros = [...tabla].filter(j => j.arquero && (j.pj || 0) > 0).sort((a, b) => b.promedio - a.promedio).slice(0, 10);
  const enRacha = tabla.map(j => ({ ...j, racha: rachaActual(j) })).filter(j => j.racha >= 2).sort((a, b) => b.racha - a.racha).slice(0, 10);
  const efectividad = [...tabla].filter(j => (j.pj || 0) > 0)
    .map(j => ({ ...j, pct: Math.round((j.promedio / 3) * 100) }))
    .sort((a, b) => b.pct - a.pct).slice(0, 10);

  const tabs = [
    { key: "goleadores", label: "⚽ Goleadores" },
    { key: "valla", label: "🧤 Valla menos vencida" },
    { key: "racha", label: "🔥 En racha" },
    { key: "efectividad", label: "📊 Efectividad" }
  ];

  return (
    <div className="glass rounded-2xl p-4 mt-6 fade-in-up">
      <div className="flex flex-wrap gap-2 mb-4">
        {tabs.map(t => (
          <button
            key={t.key}
            className={`tab-btn px-3 py-2 rounded-xl text-xs sm:text-sm font-bold bg-white/5 text-slate-200 ${tab === t.key ? "activo" : ""}`}
            onClick={() => setTab(t.key)}
          >
            {t.label}
          </button>
        ))}
      </div>

      {tab === "goleadores" && (
        <div className="space-y-2">
          {goleadores.map((j, i) => (
            <div key={j.id} className="flex items-center gap-3 fade-in-up" style={{ animationDelay: `${i * 0.05}s` }}>
              <span className="w-5 text-slate-400 text-sm">{i + 1}</span>
              <img src={j.foto || "https://via.placeholder.com/40?text=%20"} className="foto-jugador" style={{ width: 36, height: 36 }} alt={j.nombre} />
              <span className="flex-1">{j.nombre}</span>
              <span className="font-bold text-[#FFD700]">{j.goles} ⚽</span>
            </div>
          ))}
          {goleadores.length === 0 && <p className="text-slate-400 text-sm">Todavía nadie hizo goles cargados.</p>}
        </div>
      )}

      {tab === "valla" && (
        <div className="space-y-2">
          <p className="text-xs text-slate-400 mb-2">Arqueros ordenados por su promedio de puntos por partido (no llevamos goles en contra por ahora).</p>
          {arqueros.map((j, i) => (
            <div key={j.id} className="flex items-center gap-3 fade-in-up" style={{ animationDelay: `${i * 0.05}s` }}>
              <span className="w-5 text-slate-400 text-sm">{i + 1}</span>
              <img src={j.foto || "https://via.placeholder.com/40?text=%20"} className="foto-jugador" style={{ width: 36, height: 36 }} alt={j.nombre} />
              <span className="flex-1">{j.nombre} 🧤</span>
              <span className="font-bold text-[#22D3EE]">{j.promedio.toFixed(2)} pts/PJ</span>
            </div>
          ))}
          {arqueros.length === 0 && <p className="text-slate-400 text-sm">Todavía no hay arqueros con partidos jugados.</p>}
        </div>
      )}

      {tab === "racha" && (
        <div className="space-y-2">
          {enRacha.map((j, i) => (
            <div key={j.id} className="flex items-center gap-3 fade-in-up" style={{ animationDelay: `${i * 0.05}s` }}>
              <span className="w-5 text-slate-400 text-sm">{i + 1}</span>
              <img src={j.foto || "https://via.placeholder.com/40?text=%20"} className="foto-jugador" style={{ width: 36, height: 36 }} alt={j.nombre} />
              <span className="flex-1">{j.nombre}</span>
              <span className="font-bold text-orange-400">🔥 {j.racha} seguidas</span>
            </div>
          ))}
          {enRacha.length === 0 && <p className="text-slate-400 text-sm">Nadie viene con racha de 2 o más victorias.</p>}
        </div>
      )}

      {tab === "efectividad" && (
        <div className="space-y-3">
          {efectividad.map((j, i) => (
            <div key={j.id} className="fade-in-up" style={{ animationDelay: `${i * 0.05}s` }}>
              <div className="flex items-center justify-between text-sm mb-1">
                <span>{j.nombre}</span>
                <span className="font-bold text-[#FFD700]">{j.pct}%</span>
              </div>
              <BarraEfectividad pct={j.pct} />
            </div>
          ))}
          {efectividad.length === 0 && <p className="text-slate-400 text-sm">Todavía no hay partidos jugados.</p>}
        </div>
      )}
    </div>
  );
}

// ============ HERO ============
function Hero({ partidos, jugadores }) {
  const nombreDe = (id) => (jugadores.find(j => j.id === id) || {}).nombre || "?";
  const pendientes = [...partidos].filter(p => !p.finalizado).sort((a, b) => a.fecha.localeCompare(b.fecha));
  const finalizados = [...partidos].filter(p => p.finalizado).sort((a, b) => b.fecha.localeCompare(a.fecha));
  const proxima = pendientes[0];
  const ultima = finalizados[0];

  return (
    <div className="relative rounded-2xl overflow-hidden mb-8 fade-in-up glass">
      <div className="p-6 sm:p-10 flex flex-col items-center text-center relative">
        <div className="text-6xl mb-2 trofeo-glow">🏆</div>
        <h1 className="text-3xl sm:text-4xl font-extrabold tracking-tight">
          <span className="bg-gradient-to-r from-[#22D3EE] via-white to-[#FFD700] bg-clip-text text-transparent">
            TORNEO DE FÚTBOL
          </span>
        </h1>
        <div className="estrellas-hero text-xl mt-1 mb-6">★ ★ ★</div>

        <div className="grid sm:grid-cols-2 gap-4 w-full max-w-2xl">
          <div className="glass glass-hover rounded-xl p-4 text-left">

function AdminJugadores({ jugadores }) {
  const vacio = { nombre: "", foto: "", calidad: 3, arquero: false };
  const [form, setForm] = useState(vacio);
  const [editId, setEditId] = useState(null);

  const importarHistoricos = () => {
    if (!confirm("Esto agrega " + DATOS_HISTORICOS.length + " jugadores con sus estadísticas viejas (PJ/PG/PE/PP/Goles). Si un jugador ya existe con el mismo nombre, se va a duplicar. ¿Continuar?")) return;
    DATOS_HISTORICOS.forEach(d => {
      db.ref("jugadores").push({
        nombre: d.nombre, foto: "", calidad: 3, arquero: false,
        pj: d.pj, pg: d.pg, pe: d.pe, pp: d.pp, puntos: d.puntos, goles: d.goles,
        ultimos: [], historial: []
      });
    });
    alert("Listo, se importaron los jugadores. Revisá calidad y arquero de cada uno.");
  };

  const guardar = () => {
    try {
      if (!form.nombre.trim()) return alert("Poné un nombre");
      const fotoFinal = convertirLinkFoto(form.foto.trim());
      const onError = (err) => alert("No se pudo guardar: " + err.message);
      if (editId) {
        db.ref("jugadores/" + editId).update({
          nombre: form.nombre, foto: fotoFinal, calidad: form.calidad, arquero: form.arquero
        }).then(() => alert("Jugador actualizado")).catch(onError);
      } else {
        db.ref("jugadores").push({
          nombre: form.nombre, foto: fotoFinal, calidad: form.calidad, arquero: form.arquero,
          pj: 0, pg: 0, pe: 0, pp: 0, puntos: 0, goles: 0, ultimos: [], historial: []
        }).then(() => alert("Jugador agregado")).catch(onError);

      setForm(vacio);
      setEditId(null);

      alert("Error al guardar: " + err.message);

    setForm({ nombre: j.nombre, foto: j.foto || "", calidad: j.calidad || 3, arquero: !!j.arquero });

function AdminFechas({ jugadores, partidos }) {
  const [fecha, setFecha] = useState("");
  const [seleccionados, setSeleccionados] = useState({});
  const [preview, setPreview] = useState(null);

  const toggle = (id) => setSeleccionados(s => ({ ...s, [id]: !s[id] }));

  const disponibles = jugadores.filter(j => seleccionados[j.id]);

  const sortear = () => {
    if (disponibles.length < 2) return alert("Seleccioná al menos 2 jugadores disponibles");
    setPreview(armarEquipos(disponibles));
  };

  const guardarFecha = () => {
    if (!fecha) return alert("Elegí una fecha");
    if (!preview) return alert("Primero sorteá los equipos");
    db.ref("partidos").push({
      fecha,
      disponibles: disponibles.map(j => j.id),
      equipoA: preview.equipoA.map(j => j.id),
      equipoB: preview.equipoB.map(j => j.id),
      resultado: null,
      finalizado: false
    });
    setFecha(""); setSeleccionados({}); setPreview(null);
    alert("Fecha creada con los equipos sorteados");
  };

  const nombreDe = (id) => (jugadores.find(j => j.id === id) || {}).nombre || "?";

  return (
    <div>
      <div className="bg-white p-4 rounded-2xl shadow mb-4">
        <h3 className="font-bold mb-2">Nueva fecha</h3>
        <input type="date" className="border rounded-lg p-2 mb-3"
          value={fecha} onChange={e => setFecha(e.target.value)} />
        <p className="text-sm font-semibold mb-1">Jugadores disponibles:</p>
        <div className="grid grid-cols-2 sm:grid-cols-3 gap-2 mb-3">
          {jugadores.map(j => (
            <label key={j.id} className="flex items-center gap-2 text-sm bg-[#EAF4FC] rounded-lg p-2">
              <input type="checkbox" checked={!!seleccionados[j.id]} onChange={() => toggle(j.id)} />
              {j.nombre} {j.arquero && "🧤"}
            </label>
          ))}
        </div>
        <button className="bg-[#3E7CB1] text-white rounded-lg px-4 py-2 font-bold mr-2" onClick={sortear}>
          Sortear equipos
        </button>
        {preview && (
          <button className="bg-blue-600 text-white rounded-lg px-4 py-2 font-bold" onClick={guardarFecha}>
            Guardar fecha
          </button>
        )}

        {preview && (
          <div className="grid grid-cols-2 gap-3 mt-4">
            <div className="bg-blue-50 rounded-lg p-3">
              <p className="font-bold text-blue-700 mb-1">Equipo A</p>
              {preview.equipoA.map(j => <p key={j.id} className="text-sm">{j.nombre} {j.arquero && "🧤"} <Estrellas n={j.calidad} /></p>)}
            </div>
            <div className="bg-red-50 rounded-lg p-3">
              <p className="font-bold text-red-700 mb-1">Equipo B</p>
              {preview.equipoB.map(j => <p key={j.id} className="text-sm">{j.nombre} {j.arquero && "🧤"} <Estrellas n={j.calidad} /></p>)}
            </div>
          </div>
        )}
      </div>

      <h3 className="font-bold mb-2">Fechas cargadas</h3>
      <div className="space-y-3">
        {partidos.slice().reverse().map(p => (
          <div key={p.id} className="bg-white rounded-2xl shadow p-3">
            <p className="font-semibold">{p.fecha} {p.finalizado ? "✅ Finalizado" : "⏳ Pendiente"}</p>
            <div className="grid grid-cols-2 gap-2 text-sm mt-2">
              <div><span className="font-bold text-blue-700">Equipo A:</span> {(p.equipoA || []).map(nombreDe).join(", ")}</div>
              <div><span className="font-bold text-red-700">Equipo B:</span> {(p.equipoB || []).map(nombreDe).join(", ")}</div>
            </div>
            {p.finalizado && (
              <p className="text-sm mt-1 text-gray-600">
                Resultado: {p.resultado === "A" ? "Ganó Equipo A" : p.resultado === "B" ? "Ganó Equipo B" : "Empate"}
              </p>
            )}
          </div>
        ))}
        {partidos.length === 0 && <p className="text-gray-400 text-center">No hay fechas cargadas</p>}
      </div>
    </div>
  );
}

function FilaGoles({ nombre, valor, onChange }) {
  return (
    <div className="flex items-center justify-between text-sm py-1">
      <span>{nombre}</span>
      <input
        type="number" min="0" className="border rounded-lg w-16 p-1 text-center"

      />
    </div>
  );
}

function AdminResultados({ jugadores, partidos }) {
  const pendientes = partidos.filter(p => !p.finalizado);
  const [golesPorPartido, setGolesPorPartido] = useState({});

  const setGol = (partidoId, jugadorId, valor) => {
    setGolesPorPartido(g => ({
      ...g,
      [partidoId]: { ...(g[partidoId] || {}), [jugadorId]: valor }
    }));
  };

  const cargarResultado = (partido, resultado) => {
    // resultado: "A" (ganó A), "B" (ganó B), "E" (empate)
    if (!confirm("¿Confirmar este resultado? No se puede deshacer.")) return;

    const golesDeEsteMatch = golesPorPartido[partido.id] || {};

    const actualizar = (id, tipo) => {
      const j = jugadores.find(x => x.id === id);
      if (!j) return;
      const puntosGanados = tipo === "V" ? 3 : tipo === "E" ? 1 : 0;
      const golesEnEstePartido = golesDeEsteMatch[id] || 0;
      const nuevos = {
        pj: (j.pj || 0) + 1,
        pg: (j.pg || 0) + (tipo === "V" ? 1 : 0),
        pe: (j.pe || 0) + (tipo === "E" ? 1 : 0),
        pp: (j.pp || 0) + (tipo === "D" ? 1 : 0),
        puntos: (j.puntos || 0) + puntosGanados,
        goles: (j.goles || 0) + golesEnEstePartido,
        ultimos: [tipo, ...(j.ultimos || [])].slice(0, 5),
        historial: [...(j.historial || []), { fecha: partido.fecha, resultado: tipo, goles: golesEnEstePartido }]
      };
      db.ref("jugadores/" + id).update(nuevos);
    };

    const equipoA = partido.equipoA || [];
    const equipoB = partido.equipoB || [];

    if (resultado === "E") {
      equipoA.forEach(id => actualizar(id, "E"));
      equipoB.forEach(id => actualizar(id, "E"));
    } else if (resultado === "A") {
      equipoA.forEach(id => actualizar(id, "V"));
      equipoB.forEach(id => actualizar(id, "D"));
    } else {
      equipoA.forEach(id => actualizar(id, "D"));
      equipoB.forEach(id => actualizar(id, "V"));
    }

    db.ref("partidos/" + partido.id).update({ resultado, finalizado: true });
    setGolesPorPartido(g => { const copia = { ...g }; delete copia[partido.id]; return copia; });
  };

  const jugadorDe = (id) => jugadores.find(j => j.id === id) || { id, nombre: "?" };

  return (
    <div className="space-y-3">
      <h3 className="font-bold mb-2">Cargar resultado</h3>
      {pendientes.map(p => {
        const goles = golesPorPartido[p.id] || {};
        return (
          <div key={p.id} className="bg-white rounded-2xl shadow p-3">
            <p className="font-semibold mb-2">{p.fecha}</p>
            <p className="text-xs text-gray-500 mb-1">Goles de cada jugador en este partido (opcional):</p>
            <div className="grid grid-cols-2 gap-3 text-sm mb-3">
              <div>
                <p className="font-bold text-blue-700 mb-1">Equipo A</p>
                {(p.equipoA || []).map(id => (
                  <FilaGoles key={id} nombre={jugadorDe(id).nombre}
                    valor={goles[id] || 0}
                    onChange={v => setGol(p.id, id, v)} />
                ))}
              </div>
              <div>
                <p className="font-bold text-red-700 mb-1">Equipo B</p>
                {(p.equipoB || []).map(id => (
                  <FilaGoles key={id} nombre={jugadorDe(id).nombre}
                    valor={goles[id] || 0}
                    onChange={v => setGol(p.id, id, v)} />
                ))}
              </div>
            </div>
            <div className="flex gap-2">
              <button className="bg-blue-600 text-white rounded-lg px-3 py-2 text-sm font-bold" onClick={() => cargarResultado(p, "A")}>Ganó Equipo A</button>
              <button className="bg-gray-500 text-white rounded-lg px-3 py-2 text-sm font-bold" onClick={() => cargarResultado(p, "E")}>Empate</button>
              <button className="bg-red-600 text-white rounded-lg px-3 py-2 text-sm font-bold" onClick={() => cargarResultado(p, "B")}>Ganó Equipo B</button>
            </div>
          </div>
        );
      })}
      {pendientes.length === 0 && <p className="text-gray-400 text-center">No hay fechas pendientes de resultado</p>}
    </div>
  );
}

    db.ref("partidos").on("value", snap => {

      {vista === "admin" && logueado && (
        <PanelAdmin jugadores={jugadores} partidos={partidos} onSalir={() => { setLogueado(false); setVista("home"); }} />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
